services:
  postgres:
    image: postgres:18
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-devdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-devuser} -d $${POSTGRES_DB:-devdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgres://${POSTGRES_USER:-devuser}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-devdb}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in the environment or .env}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY must be set and distinct from SECRET_KEY}
      - APP_URL=${APP_URL:?APP_URL must be set (e.g. https://your-domain.com)}
      - ALLOW_PUBLIC_REGISTER=${ALLOW_PUBLIC_REGISTER:-false}
      - OAUTH_AUTO_PROVISION=${OAUTH_AUTO_PROVISION:-false}
      - OAUTH_ALLOWED_DOMAINS=${OAUTH_ALLOWED_DOMAINS:-}
      - GIT_ENABLED=${GIT_ENABLED:-true}
      - GIT_PR_SYNC_INTERVAL_MS=${GIT_PR_SYNC_INTERVAL_MS:-}
      - JSON_BODY_LIMIT=${JSON_BODY_LIMIT:-}
      - RATE_LIMIT_API_MAX=${RATE_LIMIT_API_MAX:-}
      - RATE_LIMIT_AUTH_MAX=${RATE_LIMIT_AUTH_MAX:-}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-}
      - AUTH_COOKIE_MAX_AGE_MS=${AUTH_COOKIE_MAX_AGE_MS:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VITE_APP_NAME=${VITE_APP_NAME:-ProjectManager}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}
      - GITLAB_URL=${GITLAB_URL}
      - GITLAB_CLIENT_ID=${GITLAB_CLIENT_ID}
      - GITLAB_CLIENT_SECRET=${GITLAB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
